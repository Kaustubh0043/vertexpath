server:
  port: 8080

spring:
  application:
    name: pathpilot-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pathpilot}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_EMAIL:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:40a2f11812848ab221f7db191a27e3681c15f187a51d8b9d363b8d0c3c6f8a8b} # 256-bit Hex key
  expiration: ${JWT_EXPIRATION:3600000} # 1 hour in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

ai:
  service:
    url: ${AI_SERVICE_URL:https://pathpilot-ai-engine.onrender.com}

r2:
  endpoint: ${R2_ENDPOINT:}
  access-key: ${R2_ACCESS_KEY:}
  secret-key: ${R2_SECRET_KEY:}
  bucket-name: ${R2_BUCKET_NAME:}
